# Host nginx, in front of the loopback-bound production Compose service.
events {}
http {
  access_log off;
  error_log /dev/stderr crit;
  limit_req_zone $binary_remote_addr zone=public:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=corrections:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=editorial:10m rate=5r/s;
  limit_req_status 429;
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/observatory/tls/fullchain.pem;
    ssl_certificate_key /etc/observatory/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 320k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    location = /corrections/submit {
      limit_req zone=corrections burst=5 nodelay;
      proxy_pass http://127.0.0.1:3000;
    }
    location /admin {
      limit_req zone=editorial burst=10 nodelay;
      proxy_pass http://127.0.0.1:3000;
    }
    location / {
      limit_req zone=public burst=60 nodelay;
      proxy_pass http://127.0.0.1:3000;
    }
  }
}
